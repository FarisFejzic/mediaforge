apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mediaforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/farisfejzic/mediaforge-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mediaforge
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
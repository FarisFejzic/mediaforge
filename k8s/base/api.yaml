apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mediaforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api
          image: ghcr.io/farisfejzic/mediaforge-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mediaforge-config
            - secretRef:
                name: mediaforge-secret
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mediaforge
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
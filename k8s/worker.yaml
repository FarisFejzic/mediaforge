apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mediaforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/farisfejzic/mediaforge-worker:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: mediaforge-config
            - secretRef:
                name: mediaforge-secret
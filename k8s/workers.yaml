apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-image
  namespace: mediaforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-image
  template:
    metadata:
      labels:
        app: worker-image
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: worker
          image: ghcr.io/farisfejzic/mediaforge-worker:latest
          imagePullPolicy: Always
          env:
            - name: WORKER_TYPE
              value: image
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: mediaforge-config
            - secretRef:
                name: mediaforge-secret

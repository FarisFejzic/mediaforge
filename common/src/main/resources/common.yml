spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mediaforge}
    username: ${DB_USER:mediaforge}
    password: ${DB_PASSWORD:mediaforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mediaforge}
    password: ${RABBITMQ_PASSWORD:mediaforge}
    listener:
      simple:
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
jwt:
  secret: ${JWT_SECRET:d1552be79d689a9a2b61fbc8aa81c95d35e3b73e884677ef12cefaffec3bd181}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:mediaforge}
mediaforge:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:mediaforge.jobs}
    thumbnail-queue: ${RABBITMQ_THUMBNAIL_QUEUE:jobs.thumbnail}
    thumbnail-routing-key: ${RABBITMQ_THUMBNAIL_ROUTING_KEY:job.thumbnail}
    poster-queue: ${RABBITMQ_POSTER_QUEUE:jobs.poster}
    poster-routing-key: ${RABBITMQ_POSTER_ROUTING_KEY:job.poster}
    metadata-queue: ${RABBITMQ_METADATA_QUEUE:jobs.metadata}
    metadata-routing-key: ${RABBITMQ_METADATA_ROUTING_KEY:job.metadata}
    transcode-queue: ${RABBITMQ_TRANSCODE_QUEUE:jobs.transcode}
    transcode-routing-key: ${RABBITMQ_TRANSCODE_ROUTING_KEY:job.transcode}
    preview-queue: ${RABBITMQ_PREVIEW_QUEUE:jobs.preview}
    preview-routing-key: ${RABBITMQ_PREVIEW_ROUTING_KEY:job.preview}
    waveform-queue: ${RABBITMQ_WAVEFORM_QUEUE:jobs.waveform}
    waveform-routing-key: ${RABBITMQ_WAVEFORM_ROUTING_KEY:job.waveform}
    audio-transcode-queue: ${RABBITMQ_AUDIO_TRANSCODE_QUEUE:jobs.audio-transcode}
    audio-transcode-routing-key: ${RABBITMQ_AUDIO_TRANSCODE_ROUTING_KEY:job.audio-transcode}
    dead-letter-exchange: ${RABBITMQ_DLX:mediaforge.jobs.dlx}
    dead-letter-queue: ${RABBITMQ_DLQ:jobs.dead-letter}
    dead-letter-routing-key: ${RABBITMQ_DLQ_ROUTING_KEY:job.dead-letter}
    thumbnail-wait-queue: ${RABBITMQ_THUMBNAIL_WAIT_QUEUE:jobs.thumbnail.wait}
    poster-wait-queue: ${RABBITMQ_POSTER_WAIT_QUEUE:jobs.poster.wait}
    transcode-wait-queue: ${RABBITMQ_TRANSCODE_WAIT_QUEUE:jobs.transcode.wait}
    preview-wait-queue: ${RABBITMQ_PREVIEW_WAIT_QUEUE:jobs.preview.wait}
    metadata-wait-queue: ${RABBITMQ_METADATA_WAIT_QUEUE:jobs.metadata.wait}
    waveform-wait-queue: ${RABBITMQ_WAVEFORM_WAIT_QUEUE:jobs.waveform.wait}
    audio-transcode-wait-queue: ${RABBITMQ_AUDIO_TRANSCODE_WAIT_QUEUE:jobs.audio-transcode.wait}
    retry-delay-ms: ${RABBITMQ_RETRY_DELAY_MS:10000}
  redis:
    job-status-channel: ${REDIS_JOB_STATUS_CHANNEL:job-status}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}